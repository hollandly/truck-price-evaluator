name: 更新货车市场行情

on:
  # 手动触发：在 GitHub 仓库 Actions 页面点 "Run workflow" 即可立即更新
  workflow_dispatch:
  # 定时触发：每周一、周四 北京时间 09:00 自动抓取
  schedule:
    - cron: '0 1 * * 1,4'   # UTC 01:00 = 北京时间 09:00

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: 检出仓库
        uses: actions/checkout@v4

      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 抓取最新行情
        run: python3 scraper.py

      - name: 提交更新
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add market-data.json
          if git diff --cached --quiet; then
            echo "行情无变化，跳过提交"
          else
            git commit -m "chore: 更新市场行情 $(date -u +%Y-%m-%d)"
            git push
          fi
